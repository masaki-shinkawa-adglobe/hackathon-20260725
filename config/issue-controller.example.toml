version = 1

[repository]
base_branch = "main"
remote = "origin"

[secret_scan]
runtime = "docker"
image_lock = "tools/gitleaks-image.lock"
timeout_seconds = 120
required = true

[scheduler]
max_parallel = 2
same_file_policy = "block"
base_update_policy = "block"

[planner]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
# Only a Planner timeout may use this fallback. Invalid Planner output blocks.
fallback = "deterministic"

[policy]
forbidden_paths = [".git", ".env", ".env.*", "*.pem", "*.key"]
protected_paths = [".github/workflows", "AGENTS.md", ".agents", ".gitleaks.toml", ".gitleaksignore", "tools/issue_controller"]

[merge]
allowed_paths = ["docs/**", "README.md"]
denied_paths = [".github/**", "config/**", "migrations/**", "**/package.json", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/bun.lock*"]

[[verify.commands]]
name = "lint"
argv = ["pnpm", "lint"]
timeout_seconds = 600
