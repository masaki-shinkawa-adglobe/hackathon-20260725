[project]
name = "hackathon-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
    "greenlet>=3.5.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
